<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kolachi Restaurant | Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;600;700&family=Satoshi:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07070B;
    --surface: #100F15;
    --card-bg: rgba(20, 19, 27, 0.72);
    --border: rgba(245, 158, 11, 0.16);
    --primary: #FBBF24;
    --primary-btn-from: #FBBF24;
    --primary-btn-to: #B45309;
    --text: #F4F4F5;
    --muted: rgba(212, 212, 216, 0.65);
    --input-bg: rgba(12, 11, 17, 0.7);
    --input-border: rgba(245, 158, 11, 0.22);
    --input-focus-border: #FBBF24;
  }
  @keyframes ncGradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  html { background: #07070B; }
  body {
    background: linear-gradient(-45deg, #07070B, #0F0E17, #170F25, #07070B);
    background-size: 400% 400%;
    animation: ncGradientFlow 12s ease infinite;
    color: var(--text);
    font-family: 'Satoshi', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  @keyframes pageIn{from{opacity:0;transform:translateY(20px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes morphBlob{0%,100%{border-radius:40% 60% 70% 30%/40% 50% 60% 50%}34%{border-radius:70% 30% 50% 50%/30% 30% 70% 70%}67%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}}
  @keyframes particleRise{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:.6}100%{transform:translateY(-10vh) scale(1);opacity:0}}
  @keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes staggerIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes orbitSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes successPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes stepOut{to{opacity:0;transform:translateY(-14px)}}
  @keyframes stepIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  .blob-wrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blob{position:absolute;filter:blur(12px) !important;opacity:.28;animation:morphBlob 9s ease-in-out infinite}
  .ptc-wrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .ptc{position:absolute;background:rgba(167,139,250,.75);border-radius:50%}

  .page-wrap{position:relative;z-index:10;width:100%;max-width:440px;padding:0 1rem;animation:pageIn .65s cubic-bezier(.16,1,.3,1) both}
  .card{background:var(--card-bg);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1.5px solid var(--border);border-radius:24px;padding:2.5rem 2.25rem;box-shadow:0 32px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);animation:floatCard 7s ease-in-out infinite}

  .logo-ring{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:18px;background:rgba(20,22,36,.95);position:relative;margin-bottom:.9rem;box-shadow:0 0 30px rgba(167,139,250,.2)}
  .logo-ring .orbit{position:absolute;inset:-7px;border:1.5px solid rgba(206,189,255,.2);border-radius:24px;animation:orbitSpin 9s linear infinite}
  .logo-icon{font-family:'Material Symbols Outlined';font-size:32px;color:var(--primary);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;position:relative;z-index:1}

  .field-wrap{position:relative;width:100%}
  .field-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-family:'Material Symbols Outlined';font-size:19px;color:var(--muted);pointer-events:none;transition:color .25s;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1}
  .field-wrap:focus-within .field-icon{color:var(--primary)}

  input.nc-input,input.nc-input[type="email"]{
    display:block;width:100%;height:50px;padding:0 1.5rem 0 2.85rem;
    background:var(--input-bg)!important;-webkit-appearance:none!important;appearance:none!important;
    border:1.5px solid var(--input-border)!important;border-radius:12px!important;
    color:var(--text)!important;font-family:'Satoshi',sans-serif!important;font-size:14.5px!important;
    outline:none!important;box-shadow:none!important;transition:border-color .25s,box-shadow .25s;
    -webkit-text-fill-color:var(--text)!important;
  }
  input.nc-input::placeholder{color:var(--muted)!important;opacity:1!important}
  input.nc-input:focus{border-color:var(--input-focus-border)!important;box-shadow:0 0 0 3px rgba(167,139,250,.15),0 0 18px rgba(167,139,250,.08)!important}
  input.nc-input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #0e1020 inset!important;-webkit-text-fill-color:#e1e1f2!important;transition:background-color 99999s}

  .btn-primary{width:100%;height:50px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary-btn-from),var(--primary-btn-to));color:#fff;font-family:'Satoshi',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.45rem;box-shadow:0 8px 24px -6px rgba(167,139,250,.45);transition:transform .3s cubic-bezier(.175,.885,.32,1.275),box-shadow .3s;position:relative;overflow:hidden}
  .btn-primary::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .2s}
  .btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 32px -6px rgba(167,139,250,.55)}
  .btn-primary:hover::after{background:rgba(255,255,255,.07)}
  .btn-primary:active{transform:scale(.97)}
  .btn-primary .arr{font-family:'Material Symbols Outlined';font-size:19px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;transition:transform .25s}
  .btn-primary:hover .arr{transform:translateX(4px)}

  .link{color:var(--primary);font-weight:700;text-decoration:none;transition:opacity .2s}
  .link:hover{opacity:.75}

  .s{opacity:0;animation:staggerIn .65s cubic-bezier(.16,1,.3,1) forwards}
  .s1{animation-delay:.06s}.s2{animation-delay:.14s}.s3{animation-delay:.22s}.s4{animation-delay:.30s}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(20,22,36,.97);border:1.5px solid rgba(167,139,250,.3);backdrop-filter:blur(16px);border-radius:14px;padding:11px 18px;color:var(--text);font-size:13.5px;display:flex;align-items:center;gap:9px;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s;opacity:0;z-index:999;white-space:nowrap;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast .t-icon{font-family:'Material Symbols Outlined';font-size:17px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
  .err{font-size:12.5px;color:#f87171;margin-top:5px;display:none}
  .err.show{display:block}

  .step{transition:opacity .35s,transform .35s}
  .step.gone{display:none}
  .step.exit-anim{animation:stepOut .33s forwards}
  .step.enter-anim{animation:stepIn .4s cubic-bezier(.16,1,.3,1) forwards}

  .success-icon{font-family:'Material Symbols Outlined';font-size:52px;color:#34d399;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;display:block;margin-bottom:1.2rem;animation:successPulse 2.2s ease-in-out infinite}

  /* ── MOBILE RESPONSIVENESS ── */
  @media (max-width: 480px), (max-height: 640px) {
    body {
      overflow-y: auto !important;
      align-items: flex-start !important;
      padding: 2.2rem 1rem !important;
    }
    .page-wrap {
      max-width: 420px !important;
      margin: 0 auto !important;
    }
    .card {
      padding: 2.2rem 1.6rem !important;
      border-radius: 22px !important;
      animation: none !important; /* disable floatCard on mobile to avoid layout jitter */
      box-shadow: 0 20px 48px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05) !important;
      border: 1px solid rgba(245, 158, 11, 0.16) !important;
    }
    .logo-ring {
      width: 54px !important;
      height: 54px !important;
      border-radius: 14px !important;
      margin-bottom: 0.75rem !important;
    }
    .logo-icon {
      font-size: 26px !important;
    }
    h2 {
      font-size: 22px !important;
    }
    .btn-primary, input.nc-input {
      height: 48px !important;
      font-size: 13.8px !important;
      border-radius: 12px !important;
    }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="blob-wrap">
  <div class="blob" style="width:54%;height:54%;top:-8%;left:-8%;background:radial-gradient(circle,#a78bfa,transparent 70%)"></div>
  <div class="blob" style="width:44%;height:44%;bottom:-10%;right:-4%;background:radial-gradient(circle,#7bd0ff,transparent 70%);animation-delay:-5s"></div>
  <div class="blob" style="width:32%;height:32%;top:30%;right:12%;background:radial-gradient(circle,#ffafd3,transparent 70%);animation-delay:-9s"></div>
</div>
<div class="ptc-wrap" id="ptc"></div>

<main style="position:relative;z-index:10;width:100%;display:flex;justify-content:center;padding:2rem 1rem">
<div class="page-wrap">
<div class="card">

  <!-- STEP 1 -->
  <div id="step1" class="step">
    <div class="s s1" style="text-align:center;margin-bottom:1.85rem">
      <div class="logo-ring" style="margin:0 auto .85rem">
        <div class="orbit"></div>
        <span class="logo-icon">restaurant</span>
      </div>
      <h1 style="font-family:'Clash Display',sans-serif;font-size:26px;font-weight:700;color:#e1e1f2;letter-spacing:-.5px;margin-bottom:.4rem">Forgot your password?</h1>
      <p style="font-size:13.5px;color:rgba(202,196,212,.7);line-height:1.5">No worries — we'll send reset instructions to your email address.</p>
    </div>

    <form id="forgotForm" style="display:flex;flex-direction:column;gap:.9rem">
      <div class="s s2">
        <div class="field-wrap">
          <span class="field-icon">alternate_email</span>
          <input class="nc-input" id="email" type="email" placeholder="Email Address" autocomplete="email"/>
        </div>
        <p class="err" id="forgot-err"></p>
      </div>

      <div class="s s3">
        <button type="submit" class="btn-primary" id="sendBtn">
          <span>Send Reset Link</span>
          <span class="arr">arrow_forward</span>
        </button>
      </div>

      <div class="s s4" style="text-align:center">
        <a href="/login" id="backLink1" class="link" style="font-size:13.5px;display:inline-flex;align-items:center;gap:.3rem">
          <span style="font-family:'Material Symbols Outlined';font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">arrow_back</span>
          Back to login
        </a>
      </div>
    </form>
  </div>

  <!-- STEP 2 — Success -->
  <div id="step2" class="step gone" style="text-align:center;padding:.5rem 0">
    <span class="success-icon">mark_email_read</span>
    <h2 style="font-family:'Clash Display',sans-serif;font-size:24px;font-weight:700;color:#e1e1f2;margin-bottom:.65rem">Check your inbox!</h2>
    <p style="font-size:13.5px;color:rgba(202,196,212,.75);margin-bottom:.25rem">We sent a reset link to</p>
    <p id="display-email" style="font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#cebdff;font-weight:600;margin-bottom:1.75rem"></p>
    <div style="background:rgba(167,139,250,.05);border:1px solid rgba(167,139,250,.14);border-radius:12px;padding:.9rem;margin-bottom:1.5rem;font-size:13px;color:rgba(202,196,212,.7)">
      Didn't get it? Check spam or <button id="resendBtn" style="background:none;border:none;color:#cebdff;font-size:13px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline">resend</button>.
    </div>
    <a href="/login" id="backLink2" class="btn-primary" style="text-decoration:none;max-width:190px;margin:0 auto;font-family:'Satoshi',sans-serif;font-size:15px;font-weight:700">
      <span style="font-family:'Material Symbols Outlined';font-size:18px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">arrow_back</span>
      Back to Login
    </a>
  </div>

  <!-- Legal Links -->
  <div style="text-align:center;margin-top:1.6rem;font-size:12px;color:rgba(202,196,212,0.4);display:flex;justify-content:center;gap:1rem;border-top:1px solid rgba(245,158,11,0.08);padding-top:1.1rem">
    <a href="/terms" class="link" style="text-decoration:none;font-weight:500">Terms of Service</a>
    <span style="opacity:0.3">·</span>
    <a href="/privacy" class="link" style="text-decoration:none;font-weight:500">Privacy Policy</a>
  </div>

</div>
</div>
</main>

<div class="toast" id="toast">
  <span class="t-icon" id="toast-icon">info</span>
  <span id="toast-msg"></span>
</div>

<script>
(function(){const w=document.getElementById('ptc');for(let i=0;i<38;i++){const p=document.createElement('div');p.className='ptc';const sz=Math.random()*2+1+'px';p.style.cssText=`width:${sz};height:${sz};left:${Math.random()*100}vw;opacity:${Math.random()*.4+.1};animation:particleRise ${Math.random()*12+7}s linear infinite;animation-delay:${Math.random()*14}s`;w.appendChild(p);}})();

window.showNcToast=function(msg,type){
  const t=document.getElementById('toast');const ic=document.getElementById('toast-icon');
  document.getElementById('toast-msg').textContent=msg;
  ic.textContent=type==='success'?'check_circle':type==='error'?'error':'info';
  ic.style.color=type==='success'?'#34d399':type==='error'?'#f87171':'#cebdff';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);
};

// Step 1 → 2
window.showResetSuccess=function(email){
  document.getElementById('display-email').textContent=email;
  const s1=document.getElementById('step1');const s2=document.getElementById('step2');
  s1.classList.add('exit-anim');
  setTimeout(()=>{s1.classList.add('gone');s1.classList.remove('exit-anim');s2.classList.remove('gone');s2.classList.add('enter-anim');setTimeout(()=>s2.classList.remove('enter-anim'),420);},340);
};

document.getElementById('resendBtn')&&document.getElementById('resendBtn').addEventListener('click',()=>{
  const e=document.getElementById('display-email').textContent;
  window.showNcToast('Reset link resent to '+e,'info');
});

function navTo(href){document.body.style.transition='opacity 0.38s ease';document.body.style.opacity='0';setTimeout(()=>window.location.href=href,390);}
document.addEventListener('click',function(e){
  const a=e.target.closest('a[href]');if(!a)return;
  const h=a.getAttribute('href');if(!h||h==='#'||h.startsWith('http'))return;
  e.preventDefault();navTo(h);
});
</script>
</body>
</html>
